<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.b{color:#E8EEFF;background:
  radial-gradient(760px 420px at 82% 40%,rgba(59,130,246,.30),transparent 62%),
  radial-gradient(620px 360px at 12% -10%,rgba(45,212,191,.16),transparent 60%),
  linear-gradient(120deg,#060B18 0%,#0B1530 55%,#091127 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 45%,#000 100%)}
.copy{left:440px;top:78px;width:640px}
.eyebrow{display:flex;align-items:center;gap:12px;font:600 14px/1 Inter;letter-spacing:.24em;text-transform:uppercase;color:#5EEAD4}
.eyebrow:before{content:"";width:30px;height:2px;background:#5EEAD4}
h1{font:600 40px/1.16 Sora;letter-spacing:-.02em;margin-top:22px;color:#F3F6FF}
h1 em{font-style:normal;background:linear-gradient(90deg,#5EEAD4,#60A5FA 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{font:500 14px/1 Inter;padding:9px 13px;border:1px solid rgba(148,180,255,.22);border-radius:999px;background:rgba(255,255,255,.04);color:#C8D4F2}
.chart{left:1070px;top:78px;width:410px;height:275px}
.card{left:1092px;top:70px;padding:12px 16px;border-radius:12px;background:rgba(15,25,52,.75);border:1px solid rgba(148,180,255,.22);backdrop-filter:blur(6px)}
.card .k{font:600 11px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:#8EA3CF}
.card .v{display:flex;align-items:center;gap:8px;margin-top:8px;font:600 18px/1 Sora;color:#F3F6FF}
.card .up{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:rgba(94,234,212,.16);color:#5EEAD4;font-size:14px}
</style></head><body>
<div class="b">
  <div class="grid"></div>
  <svg class="abs chart" viewBox="0 0 460 308" fill="none">
    <defs>
      <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity=".45"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
      <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g stroke="rgba(148,180,255,.10)"><line x1="0" y1="290" x2="460" y2="290"/><line x1="0" y1="220" x2="460" y2="220"/><line x1="0" y1="150" x2="460" y2="150"/><line x1="0" y1="80" x2="460" y2="80"/></g>
    <g fill="rgba(96,165,250,.16)">
      <rect x="18" y="246" width="26" height="44" rx="4"/><rect x="74" y="232" width="26" height="58" rx="4"/><rect x="130" y="238" width="26" height="52" rx="4"/>
      <rect x="186" y="206" width="26" height="84" rx="4"/><rect x="242" y="190" width="26" height="100" rx="4"/><rect x="298" y="158" width="26" height="132" rx="4"/>
      <rect x="354" y="122" width="26" height="168" rx="4"/><rect x="410" y="90" width="26" height="200" rx="4"/>
    </g>
    <path d="M0 262 C40 256 60 236 92 232 S150 240 180 214 S236 196 262 184 S320 160 346 132 S400 92 436 60 L460 44 L460 290 L0 290 Z" fill="url(#area)"/>
    <path d="M0 262 C40 256 60 236 92 232 S150 240 180 214 S236 196 262 184 S320 160 346 132 S400 92 436 60 L460 44" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#0B1530" stroke="#5EEAD4" stroke-width="3"><circle cx="92" cy="232" r="6"/><circle cx="262" cy="184" r="6"/><circle cx="346" cy="132" r="6"/></g>
    <circle cx="436" cy="60" r="9" fill="#60A5FA"/><circle cx="436" cy="60" r="18" fill="#60A5FA" opacity=".25"/>
  </svg>
  <div class="abs card"><div class="k">Organic growth</div><div class="v"><span class="up">↗</span>Search · Social · Content</div></div>
  <div class="abs copy">
    <div class="eyebrow">Digital Marketing &amp; SEO Strategist</div>
    <h1>Turning search, social &amp; content<br>into <em>measurable growth.</em></h1>
    <div class="chips"><span class="chip">SEO</span><span class="chip">Social Media</span><span class="chip">Omnichannel</span><span class="chip">Video Editing</span><span class="chip">Creative Design</span></div>
  </div>
</div></body></html>
