<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.b{color:#FAFAFA;background:
  radial-gradient(520px 300px at 30% 120%,rgba(236,72,153,.30),transparent 65%),
  radial-gradient(600px 340px at 92% -10%,rgba(249,115,22,.28),transparent 62%),
  #0B0A10}
.noise{position:absolute;inset:0;opacity:.06;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.copy{left:440px;top:76px;width:560px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);font:600 13px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#FBCFE8}
.tag i{width:8px;height:8px;border-radius:50%;background:#F43F5E;box-shadow:0 0 10px #F43F5E}
h1{margin-top:20px;font:800 54px/1.04 Sora;letter-spacing:-.035em}
h1 em{font-style:normal;background:linear-gradient(90deg,#F472B6,#FB923C);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font:500 16px/1.5 Inter;color:#A1A1AA;letter-spacing:.02em}
.sub b{color:#E4E4E7;font-weight:600}
.ed{left:1000px;top:60px;width:490px;height:288px;border-radius:16px;background:rgba(24,24,32,.88);border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.top{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.top i{width:10px;height:10px;border-radius:50%;background:#3F3F46}
.top .tc{margin-left:12px;font:500 12px/1 'JetBrains Mono',monospace;color:#FB923C}
.prev{position:absolute;left:14px;top:48px;width:196px;height:110px;border-radius:8px;background:linear-gradient(135deg,#F472B6,#FB923C);overflow:hidden}
.prev:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
.prev:before{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.25)}
.meta{position:absolute;left:226px;top:52px;right:14px}
.meta .r{display:flex;justify-content:space-between;font:500 12px/1 Inter;color:#71717A;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.meta .r b{color:#E4E4E7;font-weight:600}
.tl{position:absolute;left:14px;right:14px;top:172px;bottom:14px}
.track{position:relative;height:26px;margin-bottom:7px;border-radius:6px;background:rgba(255,255,255,.04)}
.track span.l{position:absolute;left:-2px;top:0;width:26px;font:600 10px/26px 'JetBrains Mono',monospace;color:#71717A;text-align:center}
.clip{position:absolute;top:2px;bottom:2px;border-radius:5px}
.ph{position:absolute;top:-8px;bottom:-4px;left:268px;width:2px;background:#FAFAFA}
.ph:before{content:"";position:absolute;top:-2px;left:-6px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #FAFAFA}
.wave{position:absolute;inset:6px 8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px);-webkit-mask-image:linear-gradient(0deg,transparent,#000 30%,#000 70%,transparent)}
</style></head><body>
<div class="b">
  <div class="noise"></div>
  <div class="abs copy">
    <span class="tag"><i></i>Content · Video · Design</span>
    <h1>Strategy meets<br><em>storytelling.</em></h1>
    <div class="sub"><b>Digital Marketing &amp; SEO</b> &nbsp;·&nbsp; Social Media &nbsp;·&nbsp; Omnichannel</div>
  </div>
  <div class="abs ed">
    <div class="top"><i style="background:#F43F5E"></i><i style="background:#FBBF24"></i><i style="background:#22C55E"></i><span class="tc">00:00:15:24</span></div>
    <div class="prev"></div>
    <div class="meta">
      <div class="r"><span>Format</span><b>Reel · 9:16</b></div>
      <div class="r"><span>Channels</span><b>IG · FB · YT · LI</b></div>
      <div class="r"><span>Goal</span><b>Reach → Leads</b></div>
    </div>
    <div class="tl">
      <div class="track"><span class="l">V2</span><div class="clip" style="left:150px;width:120px;background:#A855F7"></div><div class="clip" style="left:300px;width:90px;background:#A855F7;opacity:.7"></div></div>
      <div class="track"><span class="l">V1</span><div class="clip" style="left:30px;width:110px;background:#F472B6"></div><div class="clip" style="left:144px;width:150px;background:#FB7185"></div><div class="clip" style="left:298px;width:170px;background:#FB923C"></div></div>
      <div class="track"><span class="l">A1</span><div class="clip" style="left:30px;width:438px;background:rgba(52,211,153,.35)"><div class="wave"></div></div></div>
      <div class="ph"></div>
    </div>
  </div>
</div></body></html>
