<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.b{color:#EEF0FF;background:
  radial-gradient(560px 360px at 82% 50%,rgba(168,85,247,.35),transparent 65%),
  radial-gradient(520px 340px at 0% 0%,rgba(59,130,246,.22),transparent 60%),
  linear-gradient(115deg,#140F35 0%,#221A5C 50%,#2A1460 100%)}
.copy{left:440px;top:80px;width:600px}
.eyebrow{display:flex;align-items:center;gap:12px;font:600 14px/1 Inter;letter-spacing:.24em;text-transform:uppercase;color:#C4B5FD}
.eyebrow:before{content:"";width:30px;height:2px;background:#C4B5FD}
h1{font:600 42px/1.15 Sora;letter-spacing:-.02em;margin-top:22px}
h1 em{font-style:normal;background:linear-gradient(90deg,#F0ABFC,#A5B4FC);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:20px;font:400 17px/1.55 Inter;color:#C7C9EE;max-width:540px}
.net{left:975px;top:0;width:520px;height:396px}
.node{position:absolute;display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font:600 14px/1 Inter;color:#F5F3FF;transform:translate(-50%,-50%);white-space:nowrap;backdrop-filter:blur(4px)}
.node i{width:8px;height:8px;border-radius:50%;display:block}
.hub{position:absolute;left:260px;top:198px;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#F0ABFC,#8B5CF6 55%,#5B21B6);box-shadow:0 0 0 12px rgba(167,139,250,.14),0 0 0 28px rgba(167,139,250,.07),0 20px 60px rgba(139,92,246,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hub b{font:700 19px/1.1 Sora;color:#fff}
.hub span{font:500 11px/1.3 Inter;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-top:5px}
</style></head><body>
<div class="b">
  <div class="abs net">
    <svg width="520" height="396" viewBox="0 0 520 396" fill="none" style="position:absolute;inset:0">
      <g stroke="rgba(196,181,253,.45)" stroke-width="1.6" stroke-dasharray="4 6">
        <path d="M260 198 Q170 130 92 84"/><path d="M260 198 Q350 120 430 84"/>
        <path d="M260 198 Q140 200 54 198"/><path d="M260 198 Q380 200 470 198"/>
        <path d="M260 198 Q170 270 92 312"/><path d="M260 198 Q350 280 430 312"/>
      </g>
      <g fill="#E9D5FF"><circle cx="160" cy="118" r="3"/><circle cx="364" cy="122" r="3"/><circle cx="140" cy="199" r="3"/><circle cx="386" cy="199" r="3"/><circle cx="168" cy="276" r="3"/><circle cx="358" cy="282" r="3"/></g>
      <ellipse cx="260" cy="198" rx="210" ry="130" stroke="rgba(255,255,255,.07)"/>
    </svg>
    <div class="node" style="left:92px;top:84px"><i style="background:#34D399"></i>SEO</div>
    <div class="node" style="left:430px;top:84px"><i style="background:#60A5FA"></i>Social Media</div>
    <div class="node" style="left:54px;top:198px"><i style="background:#FBBF24"></i>Content</div>
    <div class="node" style="left:470px;top:198px"><i style="background:#F472B6"></i>Video</div>
    <div class="node" style="left:92px;top:312px"><i style="background:#A78BFA"></i>Email</div>
    <div class="node" style="left:430px;top:312px"><i style="background:#F87171"></i>Creative Design</div>
    <div class="hub"><b>Your<br>Brand</b><span>One story</span></div>
  </div>
  <div class="abs copy">
    <div class="eyebrow">Omnichannel Marketing</div>
    <h1>One brand. Every channel.<br><em>One consistent story.</em></h1>
    <div class="sub">Digital marketing &amp; SEO strategy that connects search, social, content and video into a single growth engine.</div>
  </div>
</div></body></html>
